; ExHentai-Archive php-fpm pools (Debian's pool.d/www.conf is read first)
;
; Two pools so image work can never block the API:
; - "www"    : everything else (API, gallery list, downloads), Debian's 5 workers
; - "images" : thumbnail/cover generation and reader resizing (api.php?action=gallerythumb, exgallerythumb,
;              archiveimage). nginx.conf routes these here by the "action" query parameter.

[www]
; Listens on Debian's default unix socket /run/php/php8.4-fpm.sock (owner www-data, the nginx user)

; Pass the container environment (e.g. IMAGE_DRIVER) to PHP and send worker errors to the container log
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; On PHP 5 the GD image buffers were not counted against memory_limit, so the old 128M was effectively
; unlimited for image work. With PHP 8 they are: resizing a 4806x6893 page in the reader peaks at
; ~250 MB with GD (~150 MB with libvips). 512M gives headroom for both engines (kept here as a safety net).
php_admin_value[memory_limit] = 512M

; Recycle workers regularly: after resizing large pages (libvips/GD) a worker can keep a few hundred MB
pm.max_requests = 500

[images]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-images.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A large page needs up to ~250 MB while being resized, so keep this pool small: at most 3 images are
; processed at the same time, further image requests wait in this pool's queue (not in front of the API)
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[memory_limit] = 512M

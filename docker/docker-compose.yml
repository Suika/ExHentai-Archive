# The database is one SQLite file in ./exhen/data (created on the first start).
# Migrating from MariaDB: dump it (mysqldump exhen > dump.sql), put the dump into ./exhen/data and,
# before the first start, run
#   docker compose run --rm exhen php import-mysql-dump.php data/dump.sql
# Back to MariaDB (the master branch version): stop the app, then
#   docker compose run --rm exhen php export-mysql-dump.php data/dump.sql
#   mysql -u exhen -p exhen < ./exhen/data/dump.sql
services:
  exhen:
    image: suika/exhentai-archive:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: exhen
    restart: unless-stopped
    ports:
      - 6767:6767
    tmpfs:
      - /var/www/exhen/tmp
    volumes:
      - ./exhen/data:/var/www/exhen/data
      - ./exhen/images:/var/www/exhen/images
      - ./exhen/archive:/var/www/exhen/archive
    environment:
      - EX_ACCESSKEY=UGANDA
      - NGINX_PORT=6767
      - EX_MEMBERID=you
      - EX_PASSHASH=wish
      - EX_IGNEOUS=suuuuure
      - EX_SK=hah
      - EX_SP=2
      - TZ=Europe/London

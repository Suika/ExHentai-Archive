# Test setup (see tests/README.md)
#
#   cd docker
#   docker compose -f docker-compose.test.yml build
#   docker compose -f docker-compose.test.yml run --rm tests                       # all default tests
#   docker compose -f docker-compose.test.yml run --rm tests --testsuite unit      # PHPUnit arguments
#   TEST_MARIADB=11.4 docker compose -f docker-compose.test.yml run --rm tests      # other MariaDB version
#   docker compose -f docker-compose.test.yml down -v                              # clean up
#
# The application code and tests are mounted, so code changes don't need a rebuild
# (only Dockerfile, composer.json or docker/ config changes do).
name: exhentai-archive-test

services:
  test-db:
    image: mariadb:${TEST_MARIADB:-10.3}
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=1
      - MARIADB_DATABASE=exhen
      - MARIADB_USER=exhen
      - MARIADB_PASSWORD=exhen
    tmpfs:
      - /var/lib/mysql

  tests:
    image: exhentai-archive:test
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    depends_on:
      - test-db
    environment:
      - DB_HOST=test-db
      - DB_NAME=exhen
      - DB_USER=exhen
      - DB_PASS=exhen
      - EX_ACCESSKEY=test-key
      - FAKE_EXHENTAI_URL=http://127.0.0.1:8090
      - FAKE_EXHENTAI_STATE=/var/tmp/fake-exhentai
      - UPDATE_SNAPSHOTS
      - SHOW_STACK_LOG
    tmpfs:
      - /var/www/exhen/tmp
      - /var/www/exhen/images:uid=33,gid=33
      - /var/www/exhen/archive:uid=33,gid=33
      - /var/tmp/fake-exhentai
      - /var/lib/sphinxsearch/data/exhen
    volumes:
      - ../classes:/var/www/exhen/classes:ro
      - ../www/js:/var/www/exhen/www/js:ro
      - ../www/css:/var/www/exhen/www/css:ro
      - ../www/index.html:/var/www/exhen/www/index.html:ro
      - ../www/api.php:/var/www/exhen/www/api.php:ro
      - ../common.php:/var/www/exhen/common.php:ro
      - ../TaskRunner.php:/var/www/exhen/TaskRunner.php:ro
      - ../db.sql:/var/www/exhen/db.sql:ro
      - ../phpunit.xml.dist:/var/www/exhen/phpunit.xml.dist:ro
      - ../tests:/var/www/exhen/tests

# Do not run in as a daemon
daemon off;

# Log errors to stdout
error_log /dev/stdout info;

user www-data;
worker_processes 4;
pid /run/nginx.pid;

events {
        worker_connections 1024;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##


        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /dev/stdout;

        ##
        # Gzip Settings
        ##

        gzip on;
        gzip_disable "msie6";

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        limit_req_zone $binary_remote_addr zone=one:10m rate=100r/s;

        map $arg_action $php_fpm_socket {
            default                                          unix:/run/php/php8.4-fpm.sock;
            ~*^(gallerythumb|exgallerythumb|archiveimage)$   unix:/run/php/php8.4-fpm-images.sock;
        }

        server {
            listen 6767 default_server;
            listen [::]:6767 default_server;
            server_name _;
            root /var/www/exhen/www;
            index index.php index.html;

            location /images {
                alias /var/www/exhen/images;
                expires 30d;
                access_log off;
            }

            location ~ .php$ {
                include /etc/nginx/fastcgi_params;
                try_files $uri =404;
                fastcgi_index index.php;
                fastcgi_split_path_info ^(.+.php)(/.+)$;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                limit_req zone=one burst=200;
                fastcgi_pass $php_fpm_socket;
            }
        }

}

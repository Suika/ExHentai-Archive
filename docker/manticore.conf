source connect {
    type = mysql
    sql_host = ${DB_HOST}
    sql_port = ${DB_PORT}
    sql_user = ${DB_USER}
    sql_pass = ${DB_PASS}
    sql_db = ${DB_NAME}
}

source galleries : connect {
    sql_attr_uint = posted
    sql_attr_uint = added
    sql_attr_bool = archived
    sql_attr_uint = deleted
    sql_attr_string = read
    sql_attr_string = color

    sql_query_pre = set names utf8
    sql_query_pre = set session group_concat_max_len = 10240
    sql_query_pre = replace into sph_counter select 1, NOW()
    sql_query = select gallery.id, gallery.archived, gallery.deleted, gallery.read, gallery.color, UNIX_TIMESTAMP(gallery.posted) as posted, UNIX_TIMESTAMP(gallery.added) as added, gallery.id, gallery.exhenid, gallery.name, gallery.origtitle, gallery.type, group_concat(tag.name, ',', tagnamespace.name, ':', tag.name) as tags from ${DB_NAME}.gallery \
        left join gallery_tag on gallery_tag.gallery_id = gallery.id \
        left join tag on tag.id = gallery_tag.tag_id and gallery_tag.id is not null \
        left join tagnamespace on tagnamespace.id = gallery_tag.namespace_id and gallery_tag.id is not null \
        where updated <= (select last_updated from sph_counter where counter_id = 1) \
        group by gallery.id \
        limit 0, 100000000
}

# Partial index: only galleries changed since the last indexing (gallery.updated from sph_counter on; the
# boundary second is taken again because "updated" has one second resolution), merged
# into "galleries" by the reindex worker (docker/reindexer.sh). Same columns and joins as "galleries".
source galleries_delta : galleries {
    sql_query_pre = set names utf8
    sql_query_pre = set session group_concat_max_len = 10240
    sql_query_pre = set @starttime = NOW()
    sql_query = select gallery.id, gallery.archived, gallery.deleted, gallery.read, gallery.color, UNIX_TIMESTAMP(gallery.posted) as posted, UNIX_TIMESTAMP(gallery.added) as added, gallery.id, gallery.exhenid, gallery.name, gallery.origtitle, gallery.type, group_concat(tag.name, ',', tagnamespace.name, ':', tag.name) as tags from ${DB_NAME}.gallery \
        left join gallery_tag on gallery_tag.gallery_id = gallery.id \
        left join tag on tag.id = gallery_tag.tag_id and gallery_tag.id is not null \
        left join tagnamespace on tagnamespace.id = gallery_tag.namespace_id and gallery_tag.id is not null \
        where updated >= (select last_updated from sph_counter where counter_id = 1) and updated <= @starttime \
        group by gallery.id \
        limit 0, 100000000
    sql_query_post = replace into sph_counter select 1, @starttime
}

source suggested_tags : connect {
    sql_attr_string = keyword
    sql_attr_uint = freq

    sql_query_pre = set names utf8
    sql_query = select tag.id, tag.name as text, tag.name as keyword, count(*) as freq from ${DB_NAME}.tag \
                left join gallery_tag on gallery_tag.tag_id = tag.id \
                group by tag.id
}

index galleries {
    source = galleries
    path = /var/lib/sphinxsearch/data/exhen/galleries
    min_word_len = 2
    # Explicit Sphinx 2.2 default charset_table: Manticore's default (non_cont) would also cover the
    # CJK ranges listed in ngram_chars below and change tokenisation.
    charset_table = 0..9, A..Z->a..z, _, a..z, U+410..U+42F->U+430..U+44F, U+430..U+44F, U+401->U+451, U+451

    blend_chars = :, @
    blend_mode = trim_none

    ngram_len = 1
    ngram_chars = U+4E00..U+9FBF, U+3040..U+309F, U+30A0..U+30FF # kanji, hiragana, katakana
}

index galleries_delta {
    source = galleries_delta
    path = /var/lib/sphinxsearch/data/exhen/galleries_delta
    min_word_len = 2
    # Explicit Sphinx 2.2 default charset_table: Manticore's default (non_cont) would also cover the
    # CJK ranges listed in ngram_chars below and change tokenisation.
    charset_table = 0..9, A..Z->a..z, _, a..z, U+410..U+42F->U+430..U+44F, U+430..U+44F, U+401->U+451, U+451

    blend_chars = :, @
    blend_mode = trim_none

    ngram_len = 1
    ngram_chars = U+4E00..U+9FBF, U+3040..U+309F, U+30A0..U+30FF # kanji, hiragana, katakana
}

index suggested {
    source = suggested_tags
    path = /var/lib/sphinxsearch/data/exhen/suggested
    min_prefix_len = 1
    # Explicit Sphinx 2.2 default charset_table, keeps the tokenisation of the old Sphinx setup
    charset_table = 0..9, A..Z->a..z, _, a..z, U+410..U+42F->U+430..U+44F, U+430..U+44F, U+401->U+451, U+451
}

indexer {
    mem_limit = 64M
}

searchd {
    listen = localhost:9312
    listen = localhost:9306:mysql
    log =  /var/lib/sphinxsearch/data/exhen/searchd_exhen.log
    query_log =  /var/lib/sphinxsearch/data/exhen/query_exhen.log
    pid_file =  /run/manticore/searchd.pid
}

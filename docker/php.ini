; ExHentai-Archive overrides, installed for both php-fpm and the CLI (on top of Debian's php.ini files)

; Never print warnings/deprecations into JSON or image responses; they go to the container output instead
; (CLI: stderr, FPM: worker output captured by the pool, see php-fpm-pool.conf)
display_errors = Off
display_startup_errors = Off
log_errors = On

; Timezone from the container TZ variable (default Europe/London, see Dockerfile)
date.timezone = ${TZ}

; Image engine: libvips is used through the FFI extension (jcupitt/vips). The default "preload" only
; allows FFI on the CLI; "true" enables it for php-fpm too. Set IMAGE_DRIVER=gd to force GD instead.
ffi.enable = true

; Memory: Debian's defaults match the old php5 setup (CLI unlimited for TaskRunner.php, FPM 128M);
; FPM is raised to 512M in php-fpm-pool.conf.
